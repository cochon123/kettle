<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ee">
  <meta name="description" content="Kettle: a quiet “I'm okay” from the people you care about.">
  <title>Kettle · Circle</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../shared/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="../shared/kettle.css">

</head>
<body>

    <img src="../shared/logo.svg" alt="" class="logo" width="30" height="30">
