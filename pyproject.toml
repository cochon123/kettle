[project]
name = "kettle"
version = "0.1.0"
description = "Kettle: a home's electricity use as a quiet 'I'm okay' signal for seniors who live alone."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "segno>=1.6",
  "pyserial>=3.5",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2"]
eval = ["numpy>=2", "pandas>=2.2", "openpyxl>=3.1"]
kasa = ["python-kasa>=0.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools]
packages = ["kettle", "kettle.cloud", "kettle.edge", "kettle.eval"]
